name: Build hack77.dylib (direct)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y clang git make curl unzip \
          gcc-multilib g++-multilib perl
    
    - name: Build .dylib with clang
      run: |
        # Создаём минимальный, но рабочий исходный файл
        cat > tweak.c << 'EOF'
        #include <stdio.h>
        #include <objc/runtime.h>
        #include <objc/message.h>
        #include <Foundation/Foundation.h>
        
        // Функция, которая выполнится при загрузке библиотеки
        __attribute__((constructor)) static void init() {
            printf("[Hack77] Dynamic library loaded successfully!\n");
            
            // Показываем уведомление в консоли устройства
            dispatch_async(dispatch_get_main_queue(), ^{
                UIAlertView *alert = [[UIAlertView alloc] initWithTitle:@"Hack77" 
                                                                message:@"Library injected successfully!" 
                                                               delegate:nil 
                                                      cancelButtonTitle:@"OK" 
                                                      otherButtonTitles:nil];
                [alert show];
            });
        }
        EOF
        
        # Компилируем в .dylib для архитектуры ARM64
        clang -arch arm64 -shared -o hack77.dylib tweak.c -framework Foundation -framework UIKit -lobjc
        
        # Проверяем результат
        ls -la hack77.dylib
        file hack77.dylib
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: hack77.dylib
        path: hack77.dylib
