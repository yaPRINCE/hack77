name: Build hack77.dylib

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git make curl unzip \
          gcc-multilib g++-multilib \
          libxml2-dev libssl-dev libplist-dev \
          libzip-dev libz-dev perl libio-compress-perl
    
    - name: Install dm.pl
      run: |
        sudo curl -L https://raw.githubusercontent.com/theos/theos/master/bin/dm.pl -o /usr/local/bin/dm.pl
        sudo chmod +x /usr/local/bin/dm.pl
    
    - name: Install and Update Theos
      run: |
        git clone --depth 1 https://github.com/theos/theos.git theos
        rm -rf theos/bin
        mkdir -p theos/bin
        cp /usr/local/bin/dm.pl theos/bin/dm.pl
        chmod +x theos/bin/dm.pl
        
        echo "THEOS=$(pwd)/theos" >> $GITHUB_ENV
        echo "$(pwd)/theos/bin" >> $GITHUB_PATH
        
        # КРИТИЧЕСКИЙ ШАГ: обновляем Theos и скачиваем vendor
        cd theos
        ./bin/update-theos || echo "Update script failed, continuing..."
        cd ..
        
        # Проверяем, что vendor появился
        ls -la theos/vendor/ || echo "Vendor still missing"
    
    - name: Manual vendor fix (if update fails)
      run: |
        # Если update-theos не сработал, скачиваем vendor вручную
        if [ ! -d "theos/vendor" ]; then
          echo "Vendor not found, downloading manually..."
          git clone --depth 1 https://github.com/theos/vendor.git theos/vendor || echo "Vendor clone failed"
          ls -la theos/vendor/
        fi
    
    - name: Build
      run: |
        export THEOS=$(pwd)/theos
        export SDKVERSION=14.5
        export IPHONEOS_DEPLOYMENT_TARGET=14.0
        export PATH=$THEOS/bin:$PATH
        
        ls -la $THEOS/bin/dm.pl
        make clean || true
        make package || true
        
        find . -name "*.dylib" -exec cp {} ./hack77.dylib \;
        ls -la hack77.dylib || echo "No dylib found"
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: hack77.dylib
        path: hack77.dylib
