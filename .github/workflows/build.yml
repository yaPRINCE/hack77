name: Build hack77.dylib

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Move files to root
      run: |
        # Если есть папка hack77_ios - перемещаем всё из неё в корень
        if [ -d "hack77_ios" ]; then
          mv hack77_ios/* ./
          mv hack77_ios/.[!.]* ./ 2>/dev/null || true
          rm -rf hack77_ios
        fi
        ls -la
    
    - name: Install Theos
      run: |
        git clone https://github.com/theos/theos.git $THEOS
        echo "THEOS=$THEOS" >> $GITHUB_ENV
    
    - name: Build
      run: |
        export THEOS=$(pwd)/theos
        export SDKVERSION=16.0
        ls -la
        make clean || true
        make package
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: hack77.dylib
        path: hack77.dylib
