name: Build hack77.dylib (direct)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git make curl unzip gcc-multilib g++-multilib perl
    
    - name: Install Theos
      run: |
        git clone --depth 1 https://github.com/theos/theos.git theos
        # Удаляем битую ссылку
        rm -f theos/bin
        mkdir -p theos/bin
        echo "THEOS=$(pwd)/theos" >> $GITHUB_ENV
        echo "$(pwd)/theos/bin" >> $GITHUB_PATH
        
        cd theos
        curl -L https://github.com/theos/sdks/archive/master.zip -o sdks.zip
        unzip -q sdks.zip
        mkdir -p sdks
        mv sdks-master/*.sdk sdks/ || true
        cd ..
    
    - name: Build only .dylib
      run: |
        export THEOS=$(pwd)/theos
        export SDKVERSION=14.5
        export PATH=$THEOS/bin:$PATH
        
        make clean || true
        make internal-tweak-compile || true
        
        find . -name "*.dylib" -exec cp {} ./hack77.dylib \;
        ls -la hack77.dylib
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: hack77.dylib
        path: hack77.dylib
