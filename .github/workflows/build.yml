name: Build hack77.dylib

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Show available SDKs
      run: |
        xcodebuild -showsdks | grep iPhoneOS
        echo "---"
        ls -la /Applications/Xcode*.app/Contents/Developer/Platforms/iPhoneOS.platform/Developer/SDKs/ || true
    
    - name: Install Theos
      run: |
        git clone https://github.com/theos/theos.git theos
        echo "THEOS=$(pwd)/theos" >> $GITHUB_ENV
        echo "$(pwd)/theos/bin" >> $GITHUB_PATH
    
    - name: Update Theos
      run: |
        cd theos
        ./bin/update-theos || echo "Update skipped"
        cd ..
    
    - name: Build
      run: |
        export THEOS=$(pwd)/theos
        export PATH=$THEOS/bin:$PATH
        
        make clean || true
        make package || true
        
        find . -name "*.dylib" -exec cp {} ./hack77.dylib \;
        ls -la hack77.dylib || echo "No dylib found"
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: hack77.dylib
        path: hack77.dylib
