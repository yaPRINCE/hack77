name: Build hack77.dylib

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dm.pl and dependencies
      run: |
        sudo cpan install IO::Compress::Lzma IO::Compress::Xz || true
        sudo cpan install IO::Compress::Base || true
        sudo curl -L https://raw.githubusercontent.com/theos/theos/master/bin/dm.pl -o /usr/local/bin/dm.pl
        sudo chmod +x /usr/local/bin/dm.pl
    
    - name: Install and Update Theos
      run: |
        git clone https://github.com/theos/theos.git $THEOS
        echo "THEOS=$THEOS" >> $GITHUB_ENV
        
        # КРИТИЧЕСКИЙ ШАГ: обновляем Theos и скачиваем vendor
        $THEOS/bin/update-theos
        
        # Проверяем, что vendor появился
        ls -la $THEOS/vendor/ || echo "Vendor still missing"
    
    - name: Build
      run: |
        export THEOS=$(pwd)/theos
        export SDKVERSION=17.0
        export PATH=$THEOS/bin:$PATH
        
        make clean || true
        make package
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: hack77.dylib
        path: hack77.dylib
