name: Build hack77.dylib

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git make curl unzip \
          gcc-multilib g++-multilib \
          libxml2-dev libssl-dev libplist-dev \
          libzip-dev libz-dev perl libio-compress-perl \
          libtool autoconf automake
    
    - name: Install dm.pl
      run: |
        sudo curl -L https://raw.githubusercontent.com/theos/theos/master/bin/dm.pl -o /usr/local/bin/dm.pl
        sudo chmod +x /usr/local/bin/dm.pl
        which dm.pl
    
    - name: Install Theos
      run: |
        git clone --depth 1 https://github.com/theos/theos.git theos
        # Копируем dm.pl в Theos
        cp /usr/local/bin/dm.pl theos/bin/dm.pl
        chmod +x theos/bin/dm.pl
        
        echo "THEOS=$(pwd)/theos" >> $GITHUB_ENV
        echo "$(pwd)/theos/bin" >> $GITHUB_PATH
        
        # Обновляем Theos
        cd theos
        make update-theos || echo "Update skipped"
        cd ..
    
    - name: Setup SDK
      run: |
        cd theos
        curl -L https://github.com/theos/sdks/archive/master.zip -o sdks.zip
        unzip -q sdks.zip
        mkdir -p sdks
        cp -r sdks-master/*.sdk sdks/ 2>/dev/null || true
        ls -la sdks/
        cd ..
    
    - name: Build
      run: |
        export THEOS=$(pwd)/theos
        export SDKVERSION=14.5
        export IPHONEOS_DEPLOYMENT_TARGET=14.0
        export PATH=$THEOS/bin:$PATH
        
        # Создаем Makefile
        cat > Makefile << 'EOF'
        ARCHS = arm64 arm64e
        TARGET = iphone:clang:14.5:14.5
        SDK = 14.5
        
        INSTALL_TARGET_PROCESSES = Standoff2
        
        include $(THEOS)/makefiles/common.mk
        
        TWEAK_NAME = hack77
        hack77_FILES = Tweak.xm
        
        hack77_CFLAGS = -fobjc-arc -std=c++17
        hack77_LDFLAGS = -framework UIKit -framework CoreGraphics -lobjc -lc++
        
        include $(THEOS_MAKE_PATH)/tweak.mk
        
        after-stage::
        	@cp $(THEOS_STAGING_DIR)/Library/MobileSubstrate/DynamicLibraries/$(TWEAK_NAME).dylib ./$(TWEAK_NAME).dylib 2>/dev/null || true
        EOF
        
        # Создаем Tweak.xm
        cat > Tweak.xm << 'EOF'
        %hook UIApplication
        - (void)sendEvent:(UIEvent *)event {
            %orig;
            NSLog(@"[Hack77] Test hook working!");
        }
        %end
        EOF
        
        # Проверяем наличие dm.pl
        ls -la $THEOS/bin/dm.pl
        which dm.pl || echo "dm.pl not in PATH"
        
        make clean || true
        make package || true
        
        find . -name "*.dylib" -exec cp {} ./hack77.dylib \;
        ls -la hack77.dylib || echo "No dylib found"
        
    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: hack77.dylib
        path: hack77.dylib
